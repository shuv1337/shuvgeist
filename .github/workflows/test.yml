name: Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  MINI_LIT_VERSION: 0.2.1

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore mini-lit from npm
        run: |
          tmp_dir="$(mktemp -d)"
          target_dir="$GITHUB_WORKSPACE/../mini-lit"
          cd "$tmp_dir"
          npm pack "@mariozechner/mini-lit@${MINI_LIT_VERSION}"
          mkdir -p "$target_dir"
          tar -xzf "mariozechner-mini-lit-${MINI_LIT_VERSION}.tgz" -C "$target_dir" --strip-components=1

      - name: Install dependencies
        run: |
          npm --prefix ../mini-lit install --ignore-scripts
          npm install

      - name: Run fast checks
        run: ./check.sh

      - name: Run component tests
        run: npm run test:component
